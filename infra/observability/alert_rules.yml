# Alert rules (P5.3) — each critical risk from §13 is wired to a route.
groups:
  - name: ingestion
    rules:
      - alert: CrawlFailureSpike
        expr: crawl_failure_total - crawl_failure_total offset 1h > 3
        for: 5m
        labels: { severity: critical, route: oncall }
        annotations:
          summary: "Crawler failures spiking (§13 top risk — a broken gov-site crawler)"
      - alert: LowCacheHitRate
        expr: cache_hit_rate < 0.3
        for: 30m
        labels: { severity: warning, route: slack }
        annotations:
          summary: "Cache hit-rate low — verify-before-refetch may be misconfigured"
      - alert: ExtractionConfidenceDrop
        expr: extraction_confidence_avg < 0.6
        for: 30m
        labels: { severity: warning, route: slack }
        annotations:
          summary: "Extraction-confidence distribution shifted down (possible hallucination drift)"
      - alert: ReviewQueueBacklog
        expr: review_queue_pending > 200
        for: 1h
        labels: { severity: warning, route: slack }
        annotations:
          summary: "Human-review queue backing up"

  - name: ml
    rules:
      - alert: ModelDrift
        expr: model_drift_psi > 0.2
        for: 15m
        labels: { severity: warning, route: slack }
        annotations:
          summary: "Feature/prediction drift beyond PSI threshold — consider retrain"

  - name: api
    rules:
      - alert: ApiErrorSpike
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels: { severity: critical, route: oncall }
        annotations:
          summary: "API 5xx error spike"
      - alert: ApiDown
        expr: up{job="api-health"} == 0
        for: 2m
        labels: { severity: critical, route: oncall }
        annotations:
          summary: "API health check failing"

  - name: cost
    rules:
      - alert: BudgetCapApproaching
        expr: budget_burn_rate > 0.8
        for: 10m
        labels: { severity: warning, route: slack }
        annotations:
          summary: "A budgeted line item (X/satellite/GPU) is >80% of its monthly cap"
