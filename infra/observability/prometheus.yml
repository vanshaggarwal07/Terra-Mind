# Prometheus scrape config (portable, non-cloud alternative to CloudWatch, P5.3).
# Scrapes the API's /ops surface and Dagster health. Alertmanager handles routing.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api"
    metrics_path: /ops/metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: "api-health"
    metrics_path: /ops/health
    static_configs:
      - targets: ["api:8000"]
  - job_name: "dagster"
    static_configs:
      - targets: ["dagster:3000"]
