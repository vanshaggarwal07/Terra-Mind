[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-api"
version = "0.1.0"
description = "FastAPI product/API layer: facts, score, builder, proximity, copilot, predictions."
requires-python = ">=3.11"
dependencies = [
    "twin-common",
    "twin-warehouse",
    "twin-ml",
    "twin-simulation",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.hatch.metadata]
allow-direct-references = true
