# Alembic config for the warehouse package.
# Invoked from the repo root: `alembic -c packages/warehouse/alembic.ini upgrade head`
[alembic]
script_location = packages/warehouse/alembic
prepend_sys_path = packages/warehouse
# The DB URL is read from the DATABASE_URL env var in env.py (not hardcoded here).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
