[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-warehouse"
version = "0.1.0"
description = "Knowledge-graph schema, SQLAlchemy models, and Alembic migrations (Postgres+PostGIS+pgvector)."
requires-python = ">=3.11"
dependencies = [
    "twin-common",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "GeoAlchemy2>=0.15",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "shapely>=2.0",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["warehouse"]

[tool.hatch.metadata]
allow-direct-references = true
