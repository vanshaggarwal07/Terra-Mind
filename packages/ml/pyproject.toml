[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-ml"
version = "0.1.0"
description = "Phase 3 prediction engine: feature store, model registry, price/traffic/flood/water/AQI models, monitoring."
requires-python = ">=3.11"
dependencies = [
    "twin-common",
    "twin-warehouse",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.hatch.metadata]
allow-direct-references = true
