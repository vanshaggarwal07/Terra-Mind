[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-simulation"
version = "0.1.0"
description = "Phase 4 what-if simulation: mutate graph state -> recompute Phase-3 predictions -> diff."
requires-python = ">=3.11"
dependencies = [
    "twin-common",
    "twin-warehouse",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["simulation"]

[tool.hatch.metadata]
allow-direct-references = true
