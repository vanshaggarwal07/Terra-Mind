[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-common"
version = "0.1.0"
description = "Shared utilities for the Property Digital Twin: config, logging, db, storage, http, hashing."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["common"]
