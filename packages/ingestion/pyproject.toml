[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-ingestion"
version = "0.1.0"
description = "Crawler fleet, Search->Cache->Verify layer, document intelligence, and Dagster orchestration."
requires-python = ">=3.11"
dependencies = [
    "twin-common",
    "twin-warehouse",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "pypdf>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.hatch.metadata]
allow-direct-references = true
