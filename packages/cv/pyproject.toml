[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin-cv"
version = "0.1.0"
description = "Phase 4 satellite change-detection: semantic segmentation + construction-signal pipeline."
requires-python = ">=3.11"
dependencies = [
    "twin-common",
    "twin-warehouse",
    "twin-ml",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["cv"]

[tool.hatch.metadata]
allow-direct-references = true
