# ---------------------------------------------------------------------------
# Root workspace for the Property Digital Twin monorepo.
#
# The Python code lives in `packages/*`, each an installable PEP 621 project.
# `make bootstrap` installs every package editable so imports resolve across
# the monorepo. This file is ALSO the single source of truth for tool config
# (ruff / mypy / pytest) shared by all packages.
#
# uv users get a native workspace via [tool.uv.workspace]; plain-pip users are
# covered by the editable installs in the Makefile.
# ---------------------------------------------------------------------------
[project]
name = "property-digital-twin"
version = "0.1.0"
description = "Property Digital Twin — Future Intelligence Platform (monorepo root)"
requires-python = ">=3.11"
readme = "README.md"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-requests",
]

[tool.uv.workspace]
members = ["packages/*"]

# --- ruff (lint + format) ---
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", ".venv", "**/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["common", "ingestion", "warehouse", "api", "ml", "cv", "simulation"]

# --- mypy (type checking) ---
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions", "apps/web"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
    "db: tests that require a live Postgres+PostGIS database",
    "network: tests that require network access",
]
